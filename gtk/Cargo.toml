[package]
name = "md-reader"
description = "Markdown Reader for GNOME (GTK 4 / libadwaita / WebKitGTK)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mdreader-core = { path = "../core" }
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
futures-channel = "0.3.34"
gtk = { version = "0.11.4", package = "gtk4", features = ["v4_14"] }
serde_json = "1.0.151"
sourceview5 = "0.11.2"
webkit6 = "0.6.1"

[[bin]]
name = "mdreader"
path = "src/main.rs"
