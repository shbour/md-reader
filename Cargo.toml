[workspace]
resolver = "3"
members = ["core", "gtk", "tauri"]
# `cargo build` at the root builds the Linux app only; the Tauri app has its
# own system requirements (see tauri/README.md).
default-members = ["core", "gtk"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[profile.release]
lto = "thin"
strip = true
